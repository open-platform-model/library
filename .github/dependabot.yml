version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # docs-kit's publish.yml is pinned by release tag and moves together
      # with .opm-docs-version, after opmodel.dev runs that release (docs-kit
      # C5, C12); a Dependabot bump would move one pin alone.
      - dependency-name: "open-platform-model/docs-kit*"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # "deps" is not a Conventional Commit type: pr-title.yml rejects it and
      # release-please drops it from the changelog. Use "build(deps)".
      prefix: "build"
      include: "scope"
