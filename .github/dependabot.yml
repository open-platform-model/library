version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # "deps" is not a Conventional Commit type: pr-title.yml rejects it and
      # release-please drops it from the changelog. Use "build(deps)".
      prefix: "build"
      include: "scope"
