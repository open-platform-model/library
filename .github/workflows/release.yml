name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Read by the cascade notify job (workspace RELEASING.md, "The cascade");
    # same shape as opm-operator's release workflow.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The library ships no binary and no container image — a release is the
      # git tag itself. release-please opens the release PR, tags vX.Y.Z on
      # merge, and creates the GitHub Release. `go get` resolves off the tag
      # with no further build steps.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
