name: Release

on:
  push:
    branches:
      - main

# No workflow-wide grant: each job declares its own (security pass, owner
# selection 30), so a read-only repo default breaks nothing.
permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # The only reader of RELEASE_APP_PRIVATE_KEY. The release Environment
    # admits main only, so no workflow on another branch can read the key
    # (owner selection 29). The job acts with the App token alone and needs
    # nothing from GITHUB_TOKEN.
    environment: release
    permissions: {}
    # Read by the cascade notify job (workspace RELEASING.md, "The cascade");
    # same shape as opm-operator's release workflow.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own. The token is scoped to this repo and to what release-please
      # uses (the release branch, tags and releases; the release PR and its
      # labels), not every permission the App's installation holds.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # The library ships no binary and no container image — a release is the
      # git tag itself. release-please opens the release PR, tags vX.Y.Z on
      # merge, and creates the GitHub Release. `go get` resolves off the tag
      # with no further build steps.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The library docs bundle of the release (docs-kit.cue, library), built from
  # the released tag and published by docs-kit's publish.yml (docs-kit
  # docs/contracts.md C5). A library release is the tag itself, so this job
  # follows release-please directly. It runs here, in the run the release-PR
  # merge starts, because publish.yml publishes only from refs/heads/main: a
  # `release: published` trigger would run on the tag ref and be refused.
  # When this job does not run, docs.yml's dispatch publishes the release
  # instead. No version is passed: opm-docs reads it from the tag.
  # This job grants what publish.yml's release mode needs and nothing more.
  # Pinned by docs-kit release tag, not a SHA: the signing certificate names
  # publish.yml at this ref, and the site trusts only docs-kit's v* tags
  # (docs-kit C5, C9). Moves with .opm-docs-version in one PR.
  publish-docs:
    name: Publish the library docs bundle
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.5.0
    with:
      project: library
      mode: release
      tag: ${{ needs.release-please.outputs.tag_name }}

  # A caller-owned job (Phase 3 wiring contract version 3.1, 4.6): it
  # declares `environment: cascade` and passes the App key only as an input
  # of the cascade-notify action, pinned to the .github main SHA.
  notify-downstream:
    name: Notify downstream
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && vars.CASCADE_NOTIFY != 'off'
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Notify downstream
        uses: open-platform-model/.github/.github/actions/cascade-notify@7b9ad1bea132f7a3f053a5db61ac3933b59ee226 # .github main
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
