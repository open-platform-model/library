name: Cascade gates

# Posts cascade/freshness (G2) and cascade/settled (G3) on every PR through
# the reusable cascade-gates workflow in the org .github repo, pinned to the
# same .github main SHA as every cascade reference here (workspace
# RELEASING.md, "Gates"; Phase 3 wiring contract version 3.1, 8.3). An ordinary PR gets
# both as `n/a`; a release-please PR gets a gates-only Deps cascade run that
# evaluates and posts them on its head. pull_request_target, but nothing is
# checked out, so no PR code runs with these permissions. Both stay warnings
# (CASCADE_G2_MODE and CASCADE_G3_MODE unset mean `warn`), and neither
# context is a required check yet.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: cascade-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: Cascade gates
    permissions:
      statuses: write
      actions: write
    uses: open-platform-model/.github/.github/workflows/cascade-gates.yml@7b9ad1bea132f7a3f053a5db61ac3933b59ee226 # .github main
    with:
      g2-mode: ${{ vars.CASCADE_G2_MODE || 'warn' }}
      g3-mode: ${{ vars.CASCADE_G3_MODE || 'warn' }}
