name: Deps cascade

# The release cascade receiver (workspace RELEASING.md, "The receiver";
# Phase 3 wiring contract 5). It runs `task -x deps:cascade` through the
# shared cascade-receive workflow in the org .github repo when core or
# catalog_opm publishes a release, daily as a sweep, and by hand, and keeps
# one rolling deps/cascade PR. Every rule lives in the shared workflow; this
# file sets only triggers, permissions, concurrency and inputs.
#
# Dry run fails closed: the receiver pushes only when the repo variable
# CASCADE_DRY_RUN is exactly `false`; unset or any other value computes the
# diff into the job summary and pushes nothing. The gate statuses are posted
# either way. Stop switches (RELEASING.md "Stop switches"): the
# deps-cascade:hold label, .cascade-hold, CASCADE_DRY_RUN, disabling this
# workflow, suspending the opm-cascade App.

on:
  repository_dispatch:
    types: [upstream-released]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and show the diff in the job summary; push nothing
        type: boolean
        default: false
      gates_only:
        description: Evaluate and post the release-PR gates only (sent by Cascade gates)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.ref != 'refs/heads/main' && format('deps-cascade-{0}', github.ref) || (inputs.gates_only && 'deps-cascade-gates' || 'deps-cascade') }}
  cancel-in-progress: false

jobs:
  cascade:
    name: Deps cascade
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: open-platform-model/.github/.github/workflows/cascade-receive.yml@main
    with:
      dry-run: ${{ inputs.dry_run == true || vars.CASCADE_DRY_RUN != 'false' }}
      gates-only: ${{ inputs.gates_only == true }}
      g2-mode: ${{ vars.CASCADE_G2_MODE || 'warn' }}
      g3-mode: ${{ vars.CASCADE_G3_MODE || 'warn' }}
      setup-go: false
      labels-managed: false
