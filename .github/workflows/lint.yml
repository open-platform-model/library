name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Read-only: no step pushes, publishes or calls the GitHub API, so a same-repo
# PR (deps/cascade included) runs this code without a write token.
permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      # The release archive, checked against the sha256 committed here before
      # anything from it runs: no install script from a mutable ref. A bump
      # moves both values together by hand (from the release's checksums.txt);
      # Dependabot does not see a run step.
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          name="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          dir="$RUNNER_TEMP/golangci-lint"
          mkdir -p "$dir"
          curl -sSfL --proto '=https' --tlsv1.2 -o "$dir/$name.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/$name.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/golangci-lint"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run linter
        run: task lint

  # The comment rule of the enhancements store, run by the shared reusable
  # workflow of .github (its references/cite-lint.md). The tool commit lives in that
  # workflow; `task cite-lint` runs the same tool at the same commit.
  # No excludes: the tree has 0 findings. Keep the exclude list equal to the one
  # in the Taskfile.yml task cite-lint if one is added.
  cite-lint:
    name: Cite lint
    permissions:
      contents: read
    uses: open-platform-model/.github/.github/workflows/cite-lint.yml@3dcc82b2f30328cc01bbc478f825842de3fd207f # .github main
    with:
      paths: .

  # Every main spec and every change, in strict mode, with the CLI pinned in
  # Taskfile.yml (OPENSPEC_VERSION). The CLI is npm code that no lockfile pins:
  # it installs without scripts, the token only reads, and no job with a write
  # token runs this task or `task check`.
  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Setup Node for the OpenSpec CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install the pinned OpenSpec CLI
        run: task openspec:install

      - name: Validate every spec and change in strict mode
        run: task openspec:check
