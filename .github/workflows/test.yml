name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: no step pushes or publishes, and the one GitHub API call (the
# wiring check's compare read of the public .github repo) needs no write, so
# a same-repo PR (deps/cascade included) runs this code without a write token.
permissions:
  contents: read

env:
  # The kernel flow integration test resolves the OPM core schema and
  # the opmodel.dev/catalogs/opm catalog from GHCR (see schema.PublicRegistry).
  # No local registry is needed — CI has network access to ghcr.io.
  CUE_REGISTRY: "opmodel.dev=ghcr.io/open-platform-model,registry.cue.works"

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      # The release-cascade callers keep the shapes the .github README ("The
      # wiring check") gives them: the caller-owned key-holding jobs, the
      # release key only in `environment: release` jobs, no Actions cache in
      # a publishing workflow, and one .github SHA on every cascade reference,
      # which --pin-on-main confirms is on .github's main. The script is a
      # byte-identical copy of .github's at that SHA; the runner's mikefarah
      # yq. task cascade:wiring:check is the offline local entry.
      - name: Verify the cascade wiring
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .tasks/cascade/wiring-check.sh --pin-on-main

      # Offline set of the release-cascade task's tests (workspace
      # RELEASING.md, section "The cascade"): no network, no cue, no
      # resolver. Every scenario runs against the stub in
      # .tasks/cascade/testdata; .github/workflows/cascade-task.yml runs the
      # full set.
      - name: Cascade task tests (offline)
        env:
          CASCADE_TEST_SET: offline
        run: |
          yq --version | grep -q mikefarah || { echo "mikefarah yq v4 is required" >&2; exit 1; }
          task -x deps:cascade:test

      # Offline tests of the API diff script (.tasks/api-diff-test.sh):
      # fixture diffs, no network, no Go build.
      - name: API diff script tests
        run: task api:diff:test

      # Offline: .opm-docs-version and every docs-kit publish.yml ref name the
      # same release. The bundle build itself is Docs / check (docs.yml).
      - name: Verify the docs-kit pins agree
        run: task docs:pins:check

      # Release PRs only (workspace RELEASING.md, section "Gates"): a release
      # never ships a dev, pseudo-version or replaced pin. A step, not a job,
      # so it cannot read as skipped-and-passed. head_ref || ref_name is the
      # shared G1 shape; here release-PR CI runs on pull_request, so head_ref
      # decides. Runs before go mod tidy so it judges the committed go.mod.
      - name: Release-pin gate (G1)
        if: startsWith(github.head_ref || github.ref_name, 'release-please--')
        run: task deps:release-check

      - name: Running Tests
        env:
          # Turn the registry-skip into a hard failure: ghcr.io is reachable in
          # CI, so the flow integration test MUST run, not silently skip.
          OPM_FLOW_TEST_FORCE: "1"
        run: |
          go mod tidy
          task test
