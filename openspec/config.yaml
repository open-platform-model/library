schema: spec-driven

references:
  - id: opm-enhancements
    remote: https://github.com/open-platform-model/enhancements.git

context: |
  # OPM Library Development Constitution

  ## Core Principles (Kernel Library)

  The library is the kernel of OPM. It provides the generic, reusable building blocks
  for loading, processing, validating, and rendering OPM `#Module`s. When the schema
  describes `#Workflow` and `#Lifecycle`, the library plans them and never runs them:
  it emits a plan and advances it one step per call, and the caller performs every
  action and owns the run state (ADR-008). Every implementation of OPM (CLI, controller,
  future runtimes) depends on this library and inherits its behavior.

  ### I. Kernel Neutrality & Determinism
  The library is consumed by many downstream implementations. It MUST NOT assume a
  particular runtime, process model, or operator persona.
  - No global mutable state; no package-level singletons that hide behavior.
  - No `os.Exit`, no direct logging output, no shell invocation.
  - No hidden environment lookups; configuration arrives explicitly via arguments.
  - Loading, parsing, and rendering MUST be deterministic given identical inputs.
  - I/O (filesystem, registry, network) MUST live at edges and accept caller-supplied configuration.
  - Logging, when needed, MUST come from the caller (parameter or `context.Context`).
  Kubernetes as a target platform is not a runtime assumption: the `opm/k8s/` tier speaks
  Kubernetes vocabulary but performs no cluster I/O, runs no loop and assumes no process model,
  and the kernel itself imports no Kubernetes package (ADR-011).

  ### II. Type Safety First
  All inputs MUST be validated at load time. Invalid modules, releases, providers, or
  configuration MUST be rejected before processing or rendering begins.
  - Validate in order: input types -> CUE schema -> module/release semantics -> render.
  - Use CUE for schema-level validation.
  - Prefer concrete Go types over `interface{}` / `any`.
  - `any` is acceptable only at genuine open-ended boundaries (raw CUE values, rendered payloads).

  ### III. Separation of Concerns
  The library MUST preserve clear package boundaries:
  - Domain logic lives in focused, single-responsibility packages, never aggregated into one monolithic API.
  - The public kernel surface lives under `opm/`; opt-in frontend convenience lives behind a clearly marked boundary a consumer MAY skip.
  - The Kubernetes decisions OPM makes live in a third tier, `opm/k8s/`, beside the kernel (ADR-011): mandatory for a frontend that targets Kubernetes, which deletes its own copy of a package when it adopts it, and fenced so that no other `opm/` package imports it. The kernel binds every frontend, the helper tier binds none, and `opm/k8s/` binds every Kubernetes frontend.
  - Errors, shared domain primitives, artifact loading, the artifact model, and the compile/render pipeline each own a distinct package.
  - Configuration validation lives on the `Kernel`, not in a standalone validation package.
  The authoritative package map is `references/package-map.md` — consult it for current package names. This constitution governs the boundaries, not the inventory.

  ### IV. Composability via Stable Contracts
  The library is a kernel; its public API is contractual.
  - Accept interfaces, return concrete structs.
  - Public surface lives in `opm/`; non-public helpers live in `internal/`.
  - `opm/` packages MUST NOT import command, controller, or runtime-framework concerns: no `opm/` package imports `k8s.io/client-go`, `sigs.k8s.io/controller-runtime` or Flux (`github.com/fluxcd/*`), and nothing in `opm/` performs a cluster action: the library ships no executor loop and no executor backend that performs a planned action against a cluster, and each frontend performs those actions with its own client (ADR-008, ADR-011).
  - The one runtime-specific dependency admitted is `k8s.io/apimachinery`, and only under `opm/k8s/` (ADR-011); the kernel imports no Kubernetes package.
  - Output formatting and presentation MUST stay outside the library.
  - Functions accept `context.Context` for any I/O, longer workflows, or cancellation.

  ### V. CUE-Native Module Resolution
  OPM modules are CUE modules. The library MUST use CUE's native module system for
  module acquisition, dependency resolution, and caching against OCI registries.
  - The library is the single place where CUE plumbing lives.
  - Custom OCI fetch logic, custom dependency resolvers, and custom caches do not belong in downstream implementations.
  - Future module sources MUST be expressed through CUE-native mechanisms where possible.

  ### VI. Semantic Versioning & Public API Discipline
  The library MUST follow SemVer 2.0.0. Public API stability is contractual because
  multiple downstream implementations depend on it.
  - MAJOR: any breaking change to `opm/` types, signatures, or behavior.
  - MINOR: additive changes that preserve existing behavior.
  - PATCH: bug fixes, performance improvements, internal refactors.
  - Pre-GA clause (beta line): from its first beta, a prerelease line (`opmodel.dev/core@v2`,
    library, cli, opm-operator) is on the path to GA. Until the
    library's first GA release, a breaking change to `opm/` types, signatures, or behavior is
    still allowed, but only as a `feat!` commit whose `BREAKING CHANGE:` footer is the migration
    note the CHANGELOG shows. It advances the `-beta.N` prerelease counter and never moves the
    module path to a new major. Stable lines (`opmodel.dev/catalogs/opm@v4` and the module
    fleets) keep the normal SemVer rule: a break is a new major. A core beta break that would
    force a catalogs/opm major needs owner sign-off. GA drops the suffix: `prerelease: false`
    plus a visible carrier commit per package, in dependency order. The MAJOR line above
    applies from GA.
  - Commits SHOULD follow Conventional Commits v1: `type(scope): description`.
  - Types: feat, fix, refactor, docs, test, chore.
  - Scope SHOULD name the affected package or subsystem; see AGENTS.md § Style for the current scope set.

  ### VII. Simplicity & YAGNI
  Start with the simplest implementation that satisfies a real downstream need.
  - Prefer direct functions over speculative abstractions.
  - Defer extension points until a consumer actually requires them.
  - Defer plug-in style hooks, callbacks, and option-bag expansion until proven necessary.
  - Every public symbol increases the SemVer surface and the burden of long-term support.

  ### VIII. Mergeable Sections (Iterative & Incremental Delivery)
  A change is delivered as the sections of its `tasks.md` (`## N. Title` headings with `N.M`
  checkboxes). Two invariants hold at every section boundary; they replace any size limit on
  the change itself.
  - **Every merge leaves `main` releasable.** A section MUST end green under the validation
    gates and MUST close with a commit task naming the Conventional Commit it lands as
    (Principle VI; scopes in AGENTS.md § Style). Nothing that would break `main` is
    carried across a section boundary.
  - **Work survives a session boundary.** The commit task is the pause point: a session that
    stops there leaves checked boxes and a clean tree, and the next session resumes by running
    apply again.
  - One PR per change, one commit per section, is the default. Section 1 is a spike whenever
    design.md carries an unverified assumption.
  - **WARNING & BLOCK**: when a request cannot be cut into sections that each satisfy both
    invariants, or needs more than about five, the Agent MUST warn, block, and propose a split
    into sequential changes (Execution Gate).

  ## Execution Gate (Agent Directive)
  Before beginning ANY implementation, the Agent MUST evaluate the request against the
  "Mergeable Sections" principle. Block only when the request cannot be cut into sections that
  each end green and leave `main` releasable, or when it needs more than about five such
  sections. In that case the Agent MUST reply with:
  "🛑 **Scope Warning**: This request does not cut into a handful of mergeable sections. I
  suggest we split it into the following changes: [list 2-3 changes, each a few sections that
  leave main releasable]. Should we start with the first?"

  ## Technology Standards

  See [CONSTITUTION.md](../CONSTITUTION.md) for full details.
  - Language: Go (version pinned in `go.mod`).
  - CUE Go SDK: `cuelang.org/go`.
  - Tests: `github.com/stretchr/testify`.
  - Build/test entrypoint: `Taskfile.yml`. The library ships no binary.

  ## Code Style

  ### Go Patterns
  - Accept interfaces, return structs.
  - Context propagation for I/O, CUE evaluation, and longer workflows.
  - Wrap errors with context: `fmt.Errorf("loading module: %w", err)`.
  - Reuse `opm/errors` types where applicable.
  - Prefer concrete types over `map[string]any`.
  - No package-level mutable state; build fresh CUE contexts at the boundary.

  ### Logging
  - The library MUST NOT log directly to stdout or stderr.
  - Accept a logger from the caller (parameter or context) when logging is needed.
  - Caller-provided log messages SHOULD be capitalized, no trailing period.

  ### Import Order
  1. Standard library
  2. External dependencies (including CUE)
  3. Local module imports (`github.com/open-platform-model/library/...`)

  ### Comments
  - Default to no enhancement reference: say what the code does and why, in the comment's own words.
  - In all text (proposal, design, specs, docs and comments), cite an enhancement only beside a reason in words, such as `(enhancement 0011)` after the sentence it explains, once at the symbol. Several enhancements: `(enhancements 0010 and 0011)`. An enhancement id is never alone, and never comes with a decision number (no `NNNN:Dn`, no `NNNN Dn`, no `NNNN:OQn`, no bare `Dn`): the store has no decision numbers.
  - To read an enhancement entry, run `openspec show <id>-<slug> --store opm-enhancements`.
  - If OpenSpec warns that the store `opm-enhancements` is not registered, report the warning and go on; the human runs `task enhancements:register`. No agent runs `openspec store register`.
  - Never cite a section, slice, phase, task or design-doc-local id (`§8.1`, `slice C2`, `task 4.2`, `design LD3`). They are not stable identifiers.
  - Never put a reference in a scaffold template, a generated file, a fixture a user copies, or a CLI output string. Those reach people with no access to the enhancements repo.
  - No `Was:` rename history in comments; `git log` owns it.
  - In CUE, the reference goes in a `// WHY` block separated from the doc comment by one blank line, never in the doc comment itself: `cue lsp` hover, `Value.Doc()` and `cue def` replay a doc comment verbatim.
  
  ## Validation Gates (before merge)
  1. `task fmt` — Code is formatted (gofmt + goimports).
  2. `task vet` — Code passes go vet.
  3. `task lint` — golangci-lint passes.
  4. `task test` — Unit tests pass.

  Equivalently, `task check` runs all four.

rules:
  proposal:
    - "Focus: WHY we're doing this, WHAT's in/out of scope"
    - "Updates when: Scope changes, intent clarifies, approach fundamentally shifts"
    - Identify affected `opm/` packages and any downstream consumers (CLI, controller).
    - State whether this is MAJOR/MINOR/PATCH per SemVer (Principle VI).
    - Breaking changes to `opm/` MUST be called out explicitly with downstream migration cost.
    - Complexity additions MUST include justification (Principle VII).
    - Scope MUST cut into at most about five tasks.md sections, each ending green and leaving
      `main` releasable on its own (Principle VIII).
    - "Delivery mode: one PR per change is the default and needs no statement. When a downstream
      consumer must pick up a published pin mid-change, add exactly one line to the proposal,
      `Delivery: one PR per section (<consumer> needs <pin> after section <N>)`, and the change
      ships section by section. In that mode the change stays active on main between PRs, and
      spec sync waits for archive after the last PR."
    - "If the change delivers a line of an enhancement's `tasks.md`, add `## Enhancement` with one line `Delivers NNNN, task X.Y.` per task; otherwise `None.`"
    - Cite an enhancement only as its id beside a reason in words (`enhancement 0011`), never alone
      and never with a decision number.

  design:
    - "Focus: HOW we'll implement it technically"
    - "Updates when: Implementation reveals better approach, constraints change"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - MUST include "Research & Decisions" section when exploration was done.
    - Format: |
        ## Research & Decisions

        ### [Topic]
        **Context**: [Why this decision was needed]
        **Explored**: [What was investigated - link to exploration notes]
        **Decision**: [Chosen option]
        **Rationale**: [Why this option was selected]
    - Include Go pseudo-code or CUE snippets where they clarify intent.
    - Detail the impact across the affected packages / pipeline phases.
    - Call out any change to the public surface in `opm/`.
    - Cite an enhancement only as its id beside a reason in words (`enhancement 0011`), never alone
      and never with a decision number.

  specs:
    - "Focus: WHAT behavior is changing (not HOW it's implemented)"
    - "Updates when: New or changed requirements emerge"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - When a requirement implements an enhancement requirement, name the enhancement id beside the
      reason in words in its body (first sentence or a trailing `Source:` line), never inside the
      `### Requirement:` header, which tools read as the requirement's name, and never with a
      decision number.
    - Describe observable behavior (returned errors, rendered output, surfaced validation results).
    - Use ADDED/MODIFIED/REMOVED sections to show deltas.
    - Include scenarios demonstrating library behavior (e.g., valid load vs invalid load, render success vs render failure).

  tasks:
    - "Focus: STEPS to take for implementation"
    - "Updates when: Tasks complete, new tasks discovered, blockers identified"
    - "CRITICAL: Every `## N.` section MUST end green under the validation gates and MUST close
      with a commit task: an ordinary `- [ ] N.M` checkbox whose text names the Conventional
      Commit to make, e.g. `- [ ] 1.4 task check green, then commit refactor(kernel): compile
      sources per verb` (types per Principle VI, scopes per AGENTS.md § Style). The commit
      task is the pause point; nothing uncommitted is carried across a section boundary."
    - "CRITICAL: Cut the change into at most about seven sections, each a coherent unit that
      leaves main releasable by itself. If it needs more, or a section cannot end green on its
      own, split into a new OpenSpec change. Section 1 is a spike whenever design.md carries an
      unverified assumption; its commit task lands what the spike produced (a test, a fixture,
      or the finding written into design.md)."
    - Group tasks by affected package (see references/package-map.md for the current package set).
    - Each task should be independently testable.
    - Include the validation gates (`task check`, or `task fmt`, `task vet`, `task lint`,
      `task test`) in every section's commit task, not as a trailing section; cross-cutting
      checks (consumer builds, `task cue:test:flow`) go into the last real section before its
      commit.
    - "The section-closing commit is the ONLY delivery operation allowed in tasks.md: no pushing,
      branching, opening or merging PRs, tagging, cutting releases, and no commit-message or
      PR-body hygiene checks. Everything past the commit happens under the repo's normal git
      workflow (one PR per change by default; one PR per section only when the proposal says
      so). Sole exception: a change whose stated deliverable is itself a release or publishing
      operation; there those steps ARE the implementation."

# Operation hooks: served to the agent by `openspec instructions apply|archive --change <name>
# --json` as operationGuidance.
operations:
  apply:
    guidance:
      - "Work section by section: every `## N.` block of tasks.md ends with a commit task. Before
        checking that box, run the section's gates (`task check`) on the whole tree and make
        exactly the named Conventional Commit (types per Principle VI, scopes per AGENTS.md
        § Style; optional plain Co-Authored-By: Claude <noreply@anthropic.com> trailer
        only, never a session link, never a bare @name, and no body line starting with word(
        because the squash body reaches release-please). Do not start the next section with
        uncommitted work in the tree."
      - "The commit task is the only delivery operation apply performs: no push, no PR, no tag,
        no release. Commit on the working branch the run started on. If the run started on
        main, create the working branch before the first commit task; never commit to main."
      - "Pausing: when the user asks to pause, or a blocker appears, finish the current section's
        commit task first if its gates are green; otherwise report exactly which boxes are
        checked and what is uncommitted in the tree. A new session resumes by running apply
        again: the checked boxes plus a clean tree are the resume state."
      - "Delivery mode: unless proposal.md carries `Delivery: one PR per section`, all section
        commits ship in one PR after the last section and the PR title carries the change's
        release class. In per-section mode each section commit is the PR title and therefore a
        release trigger; the change stays active on main between PRs, and spec sync waits for
        archive after the last PR."
  archive:
    guidance:
      - "If the change delivers a line of an enhancement's `tasks.md`, name it in the PR body; after the repo PR merges, a PR on `enhancements` ticks that line."
