version: "3"

# Silent by default — set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

includes:
  enhancements:
    taskfile: ./.tasks/enhancements.yaml

vars:
  COVERAGE_FILE: coverage.out
  COVERAGE_HTML: coverage.html

  # CUE module discovery globs (relative to library root). Each glob expands
  # to directories that contain cue.mod/module.cue. Supports both bulk
  # autodiscovery (modules/*) and pinned single-module entries.
  CUE_MODULE_GLOBS: |
    modules/*
    testdata/modules/*
    testdata/parity
    testdata/parity/opm_platform

  # The subset of CUE_MODULE_GLOBS the publish tasks may push to the local
  # registry: the fixture modules cue-versions.yml tracks. The platform
  # fixtures and the parity oracle are consumed on disk by the tests, never
  # published, and their headers say so; discovery for fmt/vet/tidy/deps still
  # covers them through CUE_MODULE_GLOBS.
  CUE_PUBLISHABLE_GLOBS: |
    testdata/modules/*

  CUE_VERSION_FILE: cue-versions.yml
  CUE_DEFAULT_VERSION: v1.0.0
  # All-local mapping, forced in-script by the publish tasks only (Registry
  # Policy rule 2, root AGENTS.md — local publish is a gated exception). Both
  # opmodel.dev and testing.opmodel.dev route to localhost so the workspace
  # fixtures (modules/opm_platform, testdata/**) publish locally; an unmapped
  # prefix would fall through to registry.cue.works.
  CUE_LOCAL_REGISTRY: "testing.opmodel.dev=localhost:5000+insecure,opmodel.dev=localhost:5000+insecure,registry.cue.works"

  # Canonical read mapping (Registry Policy, root AGENTS.md): opmodel.dev/*
  # resolves from GHCR; testing.opmodel.dev/* from the local registry. Used by
  # the discover/fmt/vet/tidy tasks — no local registry needed for reads.
  CUE_CANONICAL_REGISTRY: "opmodel.dev=ghcr.io/open-platform-model,testing.opmodel.dev=localhost:5000+insecure,registry.cue.works"

  # All-GHCR mapping (mirrors schema.PublicRegistry in opm/schema/loader.go).
  # The OPM core schema and the opmodel.dev/catalogs/opm catalog both live in
  # their own repos published to GHCR; cue.dev/x/k8s.io falls through to the
  # central registry.cue.works. Used by dep-update + drift so the on-disk
  # fixtures track the published catalog (and stay CI-resolvable, no localhost).
  CUE_GHCR_REGISTRY: "opmodel.dev=ghcr.io/open-platform-model,registry.cue.works"

  # GHCR repo holding the published OPM catalog, and the fixtures whose catalog
  # pin the drift check verifies exists on GHCR. CATALOG_FIXTURE_MODULES lists
  # cue.mod dep pins, the platform fixtures included: a platform module
  # imports its catalog, so its cue.mod pin IS the build the render executes
  # (0019:D5). The platform fixture's derived #registry version is checked
  # separately inside the task (see CATALOG_PLATFORM_FIXTURE) as the readout
  # of that pin.
  CATALOG_GHCR_REPO: "ghcr.io/open-platform-model/opmodel.dev/catalogs/opm"
  CATALOG_FIXTURE_MODULES: |
    testdata/modules/web_app
    modules/opm_platform
    testdata/parity/opm_platform
  # Platform fixture whose #registry `version` (derived by core from the
  # embedded catalog's stamped version, 0019:D5) names the build the render
  # executes. The drift check only verifies the named tag exists on GHCR;
  # bumping the cue.mod pin is an ordinary fixture update, any published tag
  # in the key's major.
  CATALOG_PLATFORM_FIXTURE: "modules/opm_platform"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ## Code quality

  fmt:
    desc: Format Go code (gofmt + goimports)
    cmds:
      - go fmt ./...
      - |
        if command -v goimports >/dev/null 2>&1; then
          goimports -w .
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint is not installed: https://golangci-lint.run/usage/install/"
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint with --fix
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint is not installed: https://golangci-lint.run/usage/install/"
    cmds:
      - golangci-lint run --fix ./...

  ## Module hygiene

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  build:
    desc: Compile all packages (no binary; library has no main)
    cmds:
      - go build ./...

  api:diff:
    desc: List incompatible changes to the exported opm/ API since the last release tag (warns on a prerelease tag, fails on a release; BASE=<tag> to pick one)
    env:
      BASE: '{{.BASE | default ""}}'
    cmds:
      - bash .tasks/api-diff.sh

  ## Tests

  test:
    desc: Run unit tests, then the render packages under the race detector
    cmds:
      # Every package once: the render packages run only in the -race pass
      # below, so they are excluded here rather than built and run twice.
      - go test $(go list ./... | grep -v -e /opm/kernel -e /opm/internal/renderstage)
      # Render shares nothing between renders (0019:D8); run the render
      # packages under -race so the concurrency claim the docs make is
      # checked on every push (the earlier shared-platform claim went
      # unchecked and was measured false, see ADR-002).
      - go test -race ./opm/kernel/... ./opm/internal/renderstage/...

  test:verbose:
    desc: Run unit tests with verbose output
    cmds:
      - go test -v ./...

  test:run:
    desc: Run a specific test by name
    summary: |
      Run a specific test by name using the TEST parameter.

      Usage:
        task test:run TEST=TestResource_GVK
        task test:run TEST=TestConfigError
    vars:
      TEST: '{{.TEST | default ""}}'
    preconditions:
      - sh: '[ -n "{{.TEST}}" ]'
        msg: "TEST variable is required. Usage: task test:run TEST=TestName"
    cmds:
      - go test -v ./... -run "{{.TEST}}"

  test:coverage:
    desc: Run tests with coverage and produce HTML report
    cmds:
      - go test -coverprofile={{.COVERAGE_FILE}} ./...
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
    generates:
      - "{{.COVERAGE_FILE}}"
      - "{{.COVERAGE_HTML}}"

  ## Docs bundle
  #
  # docs-kit.cue declares one docs bundle, library: the Go API reference
  # opm-docs generates from the exported packages under opm/, plus the
  # authored pages under docs/site/. CI builds, signs and publishes it through
  # docs-kit's publish.yml (docs.yml, release.yml); nothing here commits
  # reference pages. These tasks run the same opm-docs release locally. The
  # release is pinned in .opm-docs-version and in every publish.yml ref, and
  # docs:bundle:check refuses the two disagreeing.

  tools:opm-docs:
    desc: Install or reuse .bin/opm-docs, the checksum-verified docs-kit release named by .opm-docs-version
    cmds:
      - bash .tasks/opm-docs.sh install

  docs:bundle:
    desc: Build the library docs bundle of the work tree into out/library/ (a local preview of edge)
    deps: [tools:opm-docs]
    cmds:
      - .bin/opm-docs build --project library --out out

  docs:pins:check:
    desc: Refuse a docs-kit publish.yml ref under .github/workflows/ that names another release than .opm-docs-version (offline)
    cmds:
      - bash .tasks/opm-docs.sh pin-check

  cascade:wiring:check:
    desc: Check the release-cascade caller workflows offline (.github README, "The wiring check"; CI adds --pin-on-main)
    cmds:
      - bash .tasks/cascade/wiring-check.sh

  docs:bundle:check:
    desc: Check the docs-kit pins agree, then build and lint the library docs bundle into a temporary directory
    deps: [tools:opm-docs]
    cmds:
      - task: docs:pins:check
      - .bin/opm-docs check --project library

  ## Aggregates

  check:
    desc: Run fmt, vet, lint, tests, and the docs bundle check
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: docs:bundle:check
      - task: cascade:wiring:check

  check:fast:
    desc: Run fmt, vet, tests, and the docs bundle check (skip lint)
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: docs:bundle:check

  ## Cleanup

  clean:
    desc: Remove coverage artifacts
    cmds:
      - rm -f {{.COVERAGE_FILE}} {{.COVERAGE_HTML}}

  # ============================================================================
  # CUE module lifecycle
  #
  # Auto-discovers CUE modules via CUE_MODULE_GLOBS. Each match must contain
  # cue.mod/module.cue. Module identity comes from the `module:` field; per-
  # module version + checksum tracked in cue-versions.yml keyed by relative
  # path (e.g. modules/opm_platform, testdata/modules/web_app).
  # ============================================================================

  cue:discover:
    desc: List all discovered CUE modules
    env:
      CUE_REGISTRY: "{{.CUE_CANONICAL_REGISTRY}}"
    cmds:
      - |
        set -euo pipefail
        BOLD='\033[1m'; DIM='\033[2m'; RESET='\033[0m'
        printf "${BOLD}%-32s %-50s %s${RESET}\n" "PATH" "MODULE" "DEPS"
        while IFS= read -r glob; do
          [ -z "$glob" ] && continue
          for dir in $glob; do
            [ -f "${dir}/cue.mod/module.cue" ] || continue
            path=$(cue export "${dir}/cue.mod/module.cue" --out json | jq -r '.module')
            deps=$(cue export "${dir}/cue.mod/module.cue" --out json | jq -r '.deps // {} | keys | join(",")')
            printf "%-32s %-50s ${DIM}%s${RESET}\n" "$dir" "$path" "$deps"
          done
        done <<< '{{.CUE_MODULE_GLOBS}}'

  cue:fmt:
    desc: Format CUE files in all discovered modules
    env:
      CUE_REGISTRY: "{{.CUE_CANONICAL_REGISTRY}}"
    cmds:
      - |
        set -euo pipefail
        while IFS= read -r glob; do
          [ -z "$glob" ] && continue
          for dir in $glob; do
            [ -f "${dir}/cue.mod/module.cue" ] || continue
            echo "Formatting ${dir}..."
            (cd "$dir" && cue fmt ./...)
          done
        done <<< '{{.CUE_MODULE_GLOBS}}'

  cue:vet:
    desc: Validate all discovered CUE modules
    vars:
      CONCRETE: '{{.CONCRETE | default "false"}}'
      VET_FLAGS: '{{if eq .CONCRETE "true"}}-c{{end}}'
    env:
      CUE_REGISTRY: "{{.CUE_CANONICAL_REGISTRY}}"
    cmds:
      - |
        set -euo pipefail
        while IFS= read -r glob; do
          [ -z "$glob" ] && continue
          for dir in $glob; do
            [ -f "${dir}/cue.mod/module.cue" ] || continue
            echo "Validating ${dir}{{if eq .CONCRETE "true"}} (concrete){{end}}..."
            (cd "$dir" && cue vet {{.VET_FLAGS}} ./...)
          done
        done <<< '{{.CUE_MODULE_GLOBS}}'

  cue:tidy:
    desc: Tidy dependencies in all discovered CUE modules
    env:
      CUE_REGISTRY: "{{.CUE_CANONICAL_REGISTRY}}"
    cmds:
      - |
        set -euo pipefail
        while IFS= read -r glob; do
          [ -z "$glob" ] && continue
          for dir in $glob; do
            [ -f "${dir}/cue.mod/module.cue" ] || continue
            echo "Tidying ${dir}..."
            (cd "$dir" && cue mod tidy)
          done
        done <<< '{{.CUE_MODULE_GLOBS}}'

  cue:deps:update:
    desc: Update test CUE deps in one pass per module, core held at the kernel default
    summary: |
      For each module discovered via CUE_MODULE_GLOBS, snapshots current dep
      versions, then runs ONE `cue mod get` naming every direct opmodel.dev/*
      dep (each non-core one as "<path>@vN", the newest published build on
      its major) and one `cue mod tidy`. Third-party deps are never named:
      tidy raises one only as far as an OPM dependency requires. Getting deps one at a time silently no-ops when
      a stale sibling blocks the resolution; one call resolves them together.

      opmodel.dev/core@v2 is held at the release schema.DefaultSchemaModule
      pins (read from opm/schema/loader.go), never at the newest published
      core: the kernel renders only against that release. Set DEFAULT_CORE
      (e.g. DEFAULT_CORE=v2.0.0-beta.2) to hold another release, such as a
      default about to be committed.

      Fails loudly: a failing get or tidy prints the module directory and
      CUE's own output and exits non-zero at that module. When a dependency
      requires a core newer than the held one, it reruns the get without core
      in a throwaway copy and names each dependency whose own core
      requirement is newer than the default: advance DefaultSchemaModule
      first. Prints a colored old -> new line per dep on success.

      Usage:
        task cue:deps:update
        DEFAULT_CORE=v2.0.0-beta.2 task cue:deps:update
    vars:
      DEFAULT_CORE: '{{.DEFAULT_CORE | default ""}}'
    env:
      # Resolve against GHCR so the catalog bumps to its latest *published*
      # build: the fixtures must stay CI-resolvable.
      CUE_REGISTRY: "{{.CUE_GHCR_REGISTRY}}"
      DEFAULT_CORE: "{{.DEFAULT_CORE}}"
    preconditions:
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq is required"
      - sh: command -v cue >/dev/null 2>&1
        msg: "cue is required"
    cmds:
      - |
        #!/usr/bin/env bash
        set -euo pipefail

        BOLD='\033[1m'; DIM='\033[2m'; YELLOW='\033[1;33m'; GREEN='\033[0;32m'; CYAN='\033[1;36m'; RED='\033[0;31m'; RESET='\033[0m'

        default_core=${DEFAULT_CORE:-}
        if [ -z "$default_core" ]; then
          # grep exits 1 on no match; without this branch set -e would exit silently.
          if ! default_core=$(grep -oP 'DefaultSchemaModule = "opmodel\.dev/core@\K[^"]+' opm/schema/loader.go); then
            printf "${RED}cannot read DefaultSchemaModule from opm/schema/loader.go; set DEFAULT_CORE${RESET}\n" >&2
            exit 1
          fi
        fi
        printf "${DIM}holding opmodel.dev/core@v2 at %s${RESET}\n" "$default_core"
        cache_dir=${CUE_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/cue}

        # newer A B: true when A sorts after B as SemVer. A prerelease '-'
        # becomes '~' so GNU sort -V orders v2.0.0-beta.1 before v2.0.0.
        newer() {
          local a=${1/-/\~} b=${2/-/\~}
          [ "$a" != "$b" ] && [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -1)" = "$a" ]
        }

        while IFS= read -r glob; do
          [ -z "$glob" ] && continue
          for dir in $glob; do
            [ -f "${dir}/cue.mod/module.cue" ] || continue

            printf "==> ${CYAN}%s${RESET}\n" "$dir"

            mod_json=$(cue export "${dir}/cue.mod/module.cue" --out json)
            deps=$(echo "$mod_json" | jq -r '.deps // {} | keys[]')

            if [ -z "$deps" ]; then
              printf "    ${DIM}(no deps)${RESET}\n"
              continue
            fi

            declare -A OLD
            args=(); others=()
            while IFS= read -r dep; do
              [ -z "$dep" ] && continue
              OLD["$dep"]=$(echo "$mod_json" | jq -r --arg d "$dep" '.deps[$d].v // ""')
              case "$dep" in
                opmodel.dev/core@v2) args+=("opmodel.dev/core@${default_core}") ;;
                opmodel.dev/*) args+=("$dep"); others+=("$dep") ;;
                # Third-party pins are never named: tidy raises one only as
                # far as an OPM dependency requires.
                *) ;;
              esac
            done <<< "$deps"

            if ! out=$(cd "$dir" && cue mod get "${args[@]}" 2>&1 && cue mod tidy 2>&1); then
              printf "${RED}%s: cue mod get/tidy failed:${RESET}\n%s\n" "$dir" "$out" >&2
              # Name the culprit: resolve again without core in a throwaway
              # copy, then read each moved dependency's own module file from
              # the cache (CUE v0.17.1 has no `cue mod graph`).
              if [ "${#others[@]}" -gt 0 ]; then
                tmp=$(mktemp -d)
                trap 'rm -rf "$tmp"' EXIT
                cp -a "$dir/." "$tmp/"
                if (cd "$tmp" && cue mod get "${others[@]}" >/dev/null 2>&1); then
                  for dep in "${others[@]}"; do
                    if ! new=$(cue export "$tmp/cue.mod/module.cue" --out json | jq -r --arg d "$dep" '.deps[$d].v // empty'); then
                      printf "    %s: cannot read the resolved version\n" "$dep" >&2
                      continue
                    fi
                    [ -n "$new" ] || continue
                    # get and tidy fetch only the .mod file; extract/ fills
                    # only when something loads the module (a warm cache).
                    mf="$cache_dir/mod/download/${dep%@*}/@v/${new}.mod"
                    [ -f "$mf" ] || mf="$cache_dir/mod/extract/${dep%@*}@${new}/cue.mod/module.cue"
                    if [ ! -f "$mf" ]; then
                      printf "    %s@%s: module file not in cache (%s)\n" "${dep%@*}" "$new" "$mf" >&2
                      continue
                    fi
                    if ! req=$(cue export cue: "$mf" --out json | jq -r '.deps["opmodel.dev/core@v2"].v // empty'); then
                      printf "    %s@%s: cannot read %s\n" "${dep%@*}" "$new" "$mf" >&2
                      continue
                    fi
                    if [ -n "$req" ] && newer "$req" "$default_core"; then
                      printf "    %s@%s requires opmodel.dev/core %s; the default is %s: advance schema.DefaultSchemaModule first\n" \
                        "${dep%@*}" "$new" "$req" "$default_core" >&2
                    fi
                  done
                else
                  printf "    (the get without core also failed; no culprit named)\n" >&2
                fi
              fi
              exit 1
            fi

            new_json=$(cue export "${dir}/cue.mod/module.cue" --out json)
            while IFS= read -r dep; do
              [ -z "$dep" ] && continue
              new_ver=$(echo "$new_json" | jq -r --arg d "$dep" '.deps[$d].v // ""')
              old_ver="${OLD[$dep]:-}"
              if [ -n "$new_ver" ] && [ "$old_ver" != "$new_ver" ]; then
                printf "    %s: ${YELLOW}%s${RESET} -> ${GREEN}%s${RESET}\n" "$dep" "$old_ver" "$new_ver"
              else
                printf "    %s: ${DIM}%s (unchanged)${RESET}\n" "$dep" "$old_ver"
              fi
            done <<< "$deps"

            unset OLD
          done
        done <<< '{{.CUE_MODULE_GLOBS}}'

        printf "${BOLD}Done.${RESET}\n"

  cue:catalog:drift:
    desc: Fail if any fixture pins an opmodel.dev/catalogs/opm version that is not published on GHCR
    summary: |
      Queries GHCR (anonymously) for the published opmodel.dev/catalogs/opm
      tags, then checks each fixture's pinned version EXISTS in the published
      list. Two kinds of pin are checked:

        - cue.mod dep pins (CATALOG_FIXTURE_MODULES), keyed
          "opmodel.dev/catalogs/opm@vN" — any major.
        - the platform fixture's derived #registry `version`
          (CATALOG_PLATFORM_FIXTURE), the readout of its cue.mod pin.

      The pin is load-bearing (0010:D14, 0019:D5): the render build executes
      exactly the build the platform module's cue.mod names, so the only
      drift that can break the suite is a pin that names a build the registry
      does not serve. Bumping a pin is an ordinary fixture update, not a
      drift-check obligation — this task mirrors no kernel selection rule
      (there is none to mirror).
      Exits non-zero when a pin is unpublished. Remediate with
      `task cue:deps:update`.

      Usage:
        task cue:catalog:drift
    preconditions:
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq is required"
      - sh: command -v curl >/dev/null 2>&1
        msg: "curl is required"
    cmds:
      - |
        #!/usr/bin/env bash
        set -euo pipefail

        RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'; BOLD='\033[1m'; RESET='\033[0m'

        repo="{{.CATALOG_GHCR_REPO}}"
        # ghcr.io needs a pull token even for public reads. Derive the registry
        # host and repository path from the configured repo string.
        host="${repo%%/*}"            # ghcr.io
        path="${repo#*/}"             # open-platform-model/opmodel.dev/catalogs/opm

        token=$(curl -fsSL "https://${host}/token?scope=repository:${path}:pull" | jq -r '.token')
        if [ -z "$token" ] || [ "$token" = "null" ]; then
          echo -e "${RED}Failed to obtain a GHCR pull token for ${path}${RESET}" >&2
          exit 1
        fi

        tags=$(curl -fsSL -H "Authorization: Bearer ${token}" "https://${host}/v2/${path}/tags/list?n=1000" | jq -r '.tags[]?')
        if [ -z "$tags" ]; then
          echo -e "${RED}No tags found for ${repo}${RESET}" >&2
          exit 1
        fi

        # check NAME PINNED — the pin is load-bearing (0010:D14): the kernel
        # pulls exactly the named build, so the check is existence, not
        # currency. Sets drift=1 when the pinned tag is not published.
        drift=0
        check() {
          local name="$1" pinned="$2"
          if echo "$tags" | grep -qx "v${pinned}"; then
            echo -e "    ${name}: ${GREEN}v${pinned} (published)${RESET}"
          else
            echo -e "    ${name}: ${RED}v${pinned} — not published${RESET}"
            drift=1
          fi
        }

        # 1. cue.mod dep pins, any "opmodel.dev/catalogs/opm@vN" key.
        while IFS= read -r dir; do
          [ -z "$dir" ] && continue
          mod="${dir}/cue.mod/module.cue"
          [ -f "$mod" ] || { echo -e "${YELLOW}skip ${dir} (no cue.mod/module.cue)${RESET}"; continue; }

          pinned=$(cue export "$mod" --out json \
            | jq -r '.deps // {} | to_entries[] | select(.key | startswith("opmodel.dev/catalogs/opm@")) | .value.v' \
            | sed 's/^v//' | head -1)
          if [ -z "$pinned" ]; then
            echo -e "    ${dir}: ${YELLOW}(does not depend on the catalog)${RESET}"
            continue
          fi
          check "$dir" "$pinned"
        done <<< '{{.CATALOG_FIXTURE_MODULES}}'

        # 2. The platform fixture's #registry scalar version pins. cue eval
        # needs the core dep resolved, so make sure a registry mapping is set.
        export CUE_REGISTRY="${CUE_REGISTRY:-{{.CUE_GHCR_REGISTRY}}}"
        plat="{{.CATALOG_PLATFORM_FIXTURE}}"
        subs=$( (cd "$plat" && cue eval . -e '#registry' --out json) \
          | jq -r 'to_entries[] | select(.key | startswith("opmodel.dev/catalogs/opm")) | .value.version')
        if [ -z "$subs" ]; then
          echo -e "    ${plat}: ${RED}no opmodel.dev/catalogs/opm subscription found in #registry${RESET}"
          drift=1
        fi
        while IFS= read -r pinned; do
          [ -z "$pinned" ] && continue
          check "${plat} (#registry version)" "${pinned#v}"
        done <<< "$subs"

        if [ "$drift" -ne 0 ]; then
          echo -e "${RED}${BOLD}Unpublished catalog pin detected.${RESET} Run ${BOLD}task cue:deps:update${RESET}." >&2
          exit 1
        fi
        echo -e "${GREEN}All fixture pins name published catalog builds.${RESET}"

  cue:check:
    desc: Run cue:fmt and cue:vet across all discovered modules
    cmds:
      - task: cue:fmt
      - task: cue:vet

  cue:test:flow:
    desc: Run the render flow integration test against the on-disk web_app + opm_platform fixtures
    summary: |
      Drives `TestFlow_WebApp_OnOpmPlatform` in opm/kernel/flow_integration_test.go.

      The test acquires:
        - testdata/modules/web_app/instance  (import-authored #ModuleInstance)
        - modules/opm_platform/              (canonical Kubernetes #Platform module)
      and renders them through Kernel.Render end-to-end. CUE imports (the
      catalog and core schema) resolve from GHCR; the test skips with a clear
      message if ghcr.io is unreachable.

      Force-run (turn the skip into a hard failure) by setting
      OPM_FLOW_TEST_FORCE=1.

      Usage:
        task cue:test:flow                       # honour the registry-skip
        OPM_FLOW_TEST_FORCE=1 task cue:test:flow # require GHCR
    env:
      CUE_REGISTRY: "{{.CUE_GHCR_REGISTRY}}"
    cmds:
      - go test -v ./opm/kernel/... -run TestFlow_WebApp_OnOpmPlatform

  cue:publish:
    desc: Publish a single CUE module to local registry (PATH=<dir> [VERSION=vX.Y.Z])
    summary: |
      Publish a single discovered module by relative path.

      Usage:
        task cue:publish PATH=modules/opm_platform
        task cue:publish PATH=testdata/modules/web_app VERSION=v1.0.1
    vars:
      PATH: '{{.PATH | default ""}}'
      VERSION: '{{.VERSION | default ""}}'
    preconditions:
      - sh: '[ -n "{{.PATH}}" ]'
        msg: "PATH is required. Usage: task cue:publish PATH=<module-dir>"
      - sh: command -v yq >/dev/null 2>&1
        msg: "yq is required"
    cmds:
      - |
        set -euo pipefail
        # Force the local mapping regardless of ambient CUE_REGISTRY so a shell
        # carrying the canonical GHCR mapping can never publish to GHCR from a
        # laptop (Registry Policy rule 2).
        export CUE_REGISTRY="${OPM_PUBLISH_REGISTRY:-{{.CUE_LOCAL_REGISTRY}}}"
        DIR="{{.PATH}}"
        if [ ! -f "${DIR}/cue.mod/module.cue" ]; then
          echo "Module not found: ${DIR}" >&2
          exit 1
        fi
        publishable=0
        while IFS= read -r glob; do
          [ -z "$glob" ] && continue
          for dir in $glob; do
            [ "${dir%/}" = "${DIR%/}" ] && publishable=1
          done
        done <<< '{{.CUE_PUBLISHABLE_GLOBS}}'
        if [ "$publishable" -ne 1 ]; then
          echo "Refusing to publish ${DIR}: not in CUE_PUBLISHABLE_GLOBS (platform fixtures and the parity oracle are consumed on disk, never published)" >&2
          exit 1
        fi
        if [ -n "{{.VERSION}}" ]; then
          VERSION="{{.VERSION}}"
        else
          VERSION=$(yq ".\"${DIR}\".version // \"\"" "{{.CUE_VERSION_FILE}}")
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="{{.CUE_DEFAULT_VERSION}}"
          fi
        fi
        echo "Publishing ${DIR}@${VERSION} to ${CUE_REGISTRY}..."
        (cd "${DIR}" && cue mod publish "${VERSION}")
        echo "Published ${DIR}@${VERSION}"

  cue:publish:smart:
    desc: Detect changes per publishable CUE module, bump versions, publish in dependency order
    summary: |
      Auto-discovers publishable CUE modules via CUE_PUBLISHABLE_GLOBS in
      Taskfile.yml (the platform fixtures and the parity oracle are never
      published; they are discovered by CUE_MODULE_GLOBS for fmt/vet only).

      For each module, computes a SHA-256 checksum of .cue files (excluding
      cue.mod/), compares with the stored checksum in cue-versions.yml, and
      publishes only modules that changed.

      Module dependencies declared in cue.mod/module.cue are used to topo-
      sort the publish order — a module that depends on another discovered
      module publishes after it.

      A patch bump is applied by default. New modules (no entry in
      cue-versions.yml) publish at v1.0.0.

      Usage:
        task cue:publish:smart                # detect, bump patch, publish
        task cue:publish:smart DRY_RUN=true   # preview without executing
        task cue:publish:smart TYPE=minor     # minor bump
        task cue:publish:smart TYPE=major     # major bump
    vars:
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
      TYPE: '{{.TYPE | default "patch"}}'
    preconditions:
      - sh: command -v yq >/dev/null 2>&1
        msg: "yq is required"
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq is required"
      - sh: command -v cue >/dev/null 2>&1
        msg: "cue is required"
    cmds:
      - |
        #!/usr/bin/env bash
        set -euo pipefail
        # Force the local mapping regardless of ambient CUE_REGISTRY so a shell
        # carrying the canonical GHCR mapping can never publish to GHCR from a
        # laptop (Registry Policy rule 2).
        export CUE_REGISTRY="${OPM_PUBLISH_REGISTRY:-{{.CUE_LOCAL_REGISTRY}}}"

        VERSION_FILE="{{.CUE_VERSION_FILE}}"
        DRY_RUN="{{.DRY_RUN}}"
        BUMP_TYPE="{{.TYPE}}"
        DEFAULT_VERSION="{{.CUE_DEFAULT_VERSION}}"

        BOLD='\033[1m'; DIM='\033[2m'; RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[0;33m'; RESET='\033[0m'

        if [ ! -f "$VERSION_FILE" ]; then
          echo "{}" > "$VERSION_FILE"
        fi

        compute_checksum() {
          local dir="$1"
          find "$dir" -name '*.cue' -not -path '*/cue.mod/*' | sort | xargs sha256sum | sha256sum | awk '{print $1}'
        }

        bump_version() {
          local ver="${1#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          case "$2" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          echo "v${major}.${minor}.${patch}"
        }

        # ── Discover publishable modules ──────────────────────────────
        echo -e "${BOLD}Discovering publishable CUE modules...${RESET}"

        MOD_DIRS=()
        MOD_PATHS=()
        while IFS= read -r glob; do
          [ -z "$glob" ] && continue
          for dir in $glob; do
            [ -f "${dir}/cue.mod/module.cue" ] || continue
            path=$(cue export "${dir}/cue.mod/module.cue" --out json | jq -r '.module')
            MOD_DIRS+=("$dir")
            MOD_PATHS+=("$path")
            echo -e "  ${DIM}${dir} → ${path}${RESET}"
          done
        done <<< '{{.CUE_PUBLISHABLE_GLOBS}}'

        if [ ${#MOD_DIRS[@]} -eq 0 ]; then
          echo -e "${YELLOW}No modules discovered.${RESET}"
          exit 0
        fi

        # ── Build dep graph (intra-discovery only) ────────────────────
        DEPS_OF=()
        for i in "${!MOD_DIRS[@]}"; do
          dir="${MOD_DIRS[$i]}"
          local_deps=""
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            for j in "${!MOD_PATHS[@]}"; do
              if [ "${MOD_PATHS[$j]}" = "$dep" ]; then
                local_deps="${local_deps} ${j}"
              fi
            done
          done < <(cue export "${dir}/cue.mod/module.cue" --out json | jq -r '.deps // {} | keys[]')
          DEPS_OF+=("$local_deps")
        done

        # ── Topological sort ──────────────────────────────────────────
        ORDER=()
        VISITED=()
        VISITING=()
        for i in "${!MOD_DIRS[@]}"; do
          VISITED[$i]=0
          VISITING[$i]=0
        done

        visit() {
          local idx="$1"
          if [ "${VISITING[$idx]}" -eq 1 ]; then
            echo -e "${RED}Dependency cycle involving ${MOD_DIRS[$idx]}${RESET}" >&2
            exit 1
          fi
          if [ "${VISITED[$idx]}" -eq 1 ]; then
            return
          fi
          VISITING[$idx]=1
          for d in ${DEPS_OF[$idx]}; do
            visit "$d"
          done
          VISITING[$idx]=0
          VISITED[$idx]=1
          ORDER+=("$idx")
        }

        for i in "${!MOD_DIRS[@]}"; do
          visit "$i"
        done

        # ── Phase 1: Detect changes ──────────────────────────────────
        echo ""
        echo -e "${BOLD}Phase 1: Detecting changes...${RESET}"

        CHANGED_IDX=()
        CHANGED_NEW_VER=()

        for idx in "${ORDER[@]}"; do
          dir="${MOD_DIRS[$idx]}"
          stored=$(yq ".\"${dir}\".checksum // \"\"" "$VERSION_FILE")
          current=$(compute_checksum "$dir")
          version=$(yq ".\"${dir}\".version // \"\"" "$VERSION_FILE")

          if [ -z "$version" ] || [ "$version" = "null" ]; then
            new_version="$DEFAULT_VERSION"
            echo -e "  ${YELLOW}${dir}${RESET}: new module → ${GREEN}${new_version}${RESET}"
            CHANGED_IDX+=("$idx")
            CHANGED_NEW_VER+=("$new_version")
          elif [ -z "$stored" ] || [ "$stored" = "null" ]; then
            new_version=$(bump_version "$version" "$BUMP_TYPE")
            echo -e "  ${YELLOW}${dir}${RESET}: changed (no stored checksum) → ${version} → ${GREEN}${new_version}${RESET}"
            CHANGED_IDX+=("$idx")
            CHANGED_NEW_VER+=("$new_version")
          elif [ "$stored" != "$current" ]; then
            new_version=$(bump_version "$version" "$BUMP_TYPE")
            echo -e "  ${YELLOW}${dir}${RESET}: changed → ${version} → ${GREEN}${new_version}${RESET}"
            CHANGED_IDX+=("$idx")
            CHANGED_NEW_VER+=("$new_version")
          else
            echo -e "  ${dir}: unchanged"
          fi
        done

        if [ ${#CHANGED_IDX[@]} -eq 0 ]; then
          echo ""
          echo -e "${GREEN}No changes detected. Nothing to publish.${RESET}"
          exit 0
        fi

        if [ "$DRY_RUN" = "true" ]; then
          echo ""
          echo -e "${BOLD}Dry run — no changes made.${RESET}"
          exit 0
        fi

        # ── Phase 2: Publish in dep order ────────────────────────────
        echo ""
        echo -e "${BOLD}Phase 2: Publishing...${RESET}"

        for k in "${!CHANGED_IDX[@]}"; do
          idx="${CHANGED_IDX[$k]}"
          dir="${MOD_DIRS[$idx]}"
          new_version="${CHANGED_NEW_VER[$k]}"

          echo ""
          echo -e "${BOLD}${GREEN}[${dir}]${RESET} → ${GREEN}${new_version}${RESET}"

          yq -i ".\"${dir}\".version = \"${new_version}\"" "$VERSION_FILE"

          echo "  Tidying..."
          (cd "$dir" && cue mod tidy)

          echo "  Publishing ${dir}@${new_version}..."
          if ! (cd "$dir" && cue mod publish "${new_version}"); then
            echo -e "  ${RED}Failed to publish ${dir}${RESET}" >&2
            exit 1
          fi

          new_checksum=$(compute_checksum "$dir")
          yq -i ".\"${dir}\".checksum = \"${new_checksum}\"" "$VERSION_FILE"
          echo -e "  Checksum: ${DIM}${new_checksum:0:12}...${RESET}"
        done

        echo ""
        echo -e "${BOLD}${GREEN}Done.${RESET} Published ${#CHANGED_IDX[@]} module(s)."
      - task: cue:tidy
      - task: cue:fmt
      - task: cue:vet

  # ============================================================================
  # Release
  # ============================================================================

  # The release cascade task (workspace RELEASING.md, section "The cascade";
  # Phase 2 cascade contract §3 and §5). Always run with `task -x`: plain
  # `task` turns exit 3 ("nothing to do") into 201. The resolver var is
  # declared per task through this anchor, never globally, so no other task
  # runs git for it.
  deps:cascade:
    desc: Move core and the opm catalog to the newest published versions (exit 0 changed, 3 nothing to do)
    summary: |
      Moves the library's two upstream pins in the working tree only: no
      commit, no branch, no push. Exit 0 when the tree changed, 3 when there
      was nothing to do, anything else on error. Run it with `task -x`.

        - core: DefaultSchemaModule in opm/schema/loader.go (shipped; the PR
          carries need-human-review), then the core pin of testdata/cue.mod and
          every testdata/render tree as text, and of the CUE_MODULE_GLOBS
          modules through cue mod get and tidy;
        - the opm catalog: the CUE_MODULE_GLOBS modules, as far as the
          loader's core allows.

      Honours .cascade-frozen and .cascade-hold. Warnings land in
      .git/cascade/warnings. Needs the shared resolver beside the workspace
      (../.github) or CASCADE_RESOLVER. `task cue:deps:update` stays the
      hand-run task.

      Usage:
        task -x deps:cascade
        CASCADE_RESOLVER=$PWD/.tasks/cascade/testdata/stub-resolve.sh task -x deps:cascade
    vars: &cascade_vars
      CASCADE_RESOLVER_PATH:
        sh: |
          if [ -n "${CASCADE_RESOLVER:-}" ]; then
            case "$CASCADE_RESOLVER" in /*) ;; *) echo "CASCADE_RESOLVER must be absolute" >&2; exit 1 ;; esac
            printf '%s\n' "$CASCADE_RESOLVER"; exit 0
          fi
          common=$(git rev-parse --path-format=absolute --git-common-dir) || exit 1
          printf '%s\n' "$(dirname "$common")/../.github/.github/scripts/cascade/cascade-resolve.sh"
    env:
      CASCADE_RESOLVER: '{{.CASCADE_RESOLVER_PATH}}'
      CASCADE_MODULE_GLOBS: '{{.CUE_MODULE_GLOBS}}'
    preconditions:
      - &cascade_resolver_check
        sh: test -x '{{.CASCADE_RESOLVER_PATH}}'
        msg: "cascade resolver not found: check out open-platform-model/.github beside this repo, or set CASCADE_RESOLVER"
      - sh: command -v git >/dev/null 2>&1
        msg: "git is required"
      - &cascade_yq_check
        sh: yq --version 2>&1 | grep -q mikefarah
        msg: "yq v4 (mikefarah) is required"
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq is required"
    cmds:
      - .tasks/cascade/cascade.sh

  deps:cascade:title:
    desc: Print the cascade PR title computed from the working tree's diff
    vars: *cascade_vars
    env:
      CASCADE_RESOLVER: '{{.CASCADE_RESOLVER_PATH}}'
    preconditions:
      - *cascade_resolver_check
    cmds:
      - '"$CASCADE_RESOLVER" title --classes .tasks/cascade/classes --pins .tasks/cascade/pins.sh'

  deps:cascade:body:
    desc: Print the cascade PR body computed from the working tree's diff
    vars: *cascade_vars
    env:
      CASCADE_RESOLVER: '{{.CASCADE_RESOLVER_PATH}}'
    preconditions:
      - *cascade_resolver_check
    cmds:
      - '"$CASCADE_RESOLVER" body --classes .tasks/cascade/classes --pins .tasks/cascade/pins.sh'

  deps:cascade:test:
    desc: Test deps:cascade in throwaway copies of the tree against the resolver stub
    summary: |
      Runs .tasks/cascade/test.sh: the stub checksum and pin-report checks,
      then the scenarios, each in its own throwaway copy of the tree (this
      checkout is never touched). CASCADE_TEST_SET=offline runs the set the
      required `Go tests` job runs (no network, no cue); the default, all,
      adds the network scenarios. Run it with `task -x`.

      Needs no resolver: every scenario runs against the stub in
      .tasks/cascade/testdata. S5 (title and body) runs only when
      CASCADE_RESOLVER_REAL names the real resolver.

      Usage:
        CASCADE_TEST_SET=offline task -x deps:cascade:test
        task -x deps:cascade:test
    preconditions:
      - *cascade_yq_check
    cmds:
      - .tasks/cascade/test.sh

  deps:release-check:
    desc: Fail if the tree carries a dev, pseudo-version or replaced pin (G1 release-pin gate)
    summary: |
      The G1 release-pin gate (workspace RELEASING.md, section "Gates"). CI
      runs it in the `Go tests` job on release-please-- branches; run it by
      hand before cutting a release. Offline: reads go.mod and tracked files
      only, no network, no cue binary, no module download.

      Fails when any of these holds:

        1. go.mod carries a replace directive.
        2. go.mod requires a github.com/open-platform-model/* module at a Go
           pseudo-version (third-party pseudo-versions are fine).
        3. A tracked cue.mod/module.cue pins a -0.dev. version, or a non-test
           Go file under opm/ carries a quoted -0.dev. version literal (the
           shipped DefaultSchemaModule lives there).
        4. A cue.mod/local-module.cue is tracked anywhere.

      .cascade-frozen and .cascade-hold are ignored: neither can make a dev
      or replaced pin legitimate in a release.

      Usage:
        task deps:release-check
    preconditions:
      - sh: command -v go >/dev/null 2>&1
        msg: "go is required"
      - sh: command -v jq >/dev/null 2>&1
        msg: "jq is required"
      - sh: command -v git >/dev/null 2>&1
        msg: "git is required"
    cmds:
      - |
        #!/usr/bin/env bash
        set -euo pipefail

        RED='\033[0;31m'; GREEN='\033[0;32m'; BOLD='\033[1m'; RESET='\033[0m'
        fail=0
        report() { echo -e "==> ${RED}$1${RESET}"; echo "$2" | sed 's/^/    /'; fail=1; }

        modjson=$(go mod edit -json)

        # 1. Go replace directives (any module).
        hits=$(echo "$modjson" | jq -r '.Replace[]? | "\(.Old.Path)\(if .Old.Version then "@"+.Old.Version else "" end) => \(.New.Path)\(if .New.Version then "@"+.New.Version else "" end)"')
        [ -z "$hits" ] || report "go.mod carries replace directives:" "$hits"

        # 2. OPM Go requirements at a pseudo-version (vX.0.0-ts-hash,
        # vX.Y.Z-pre.0.ts-hash, vX.Y.Z-0.ts-hash).
        hits=$(echo "$modjson" \
          | jq -r '.Require[]? | select(.Path | startswith("github.com/open-platform-model/")) | "\(.Path) \(.Version)"' \
          | grep -E '[-.][0-9]{14}-[0-9a-f]{12}$' || true)
        [ -z "$hits" ] || report "OPM Go modules at a pseudo-version:" "$hits"

        # 3. CUE dev pins in every tracked cue.mod, and dev literals in shipped
        # (non-test) Go under opm/. Capture and test the output, never grep's
        # or xargs' exit status; -H keeps the filename for a single file.
        # Non-test files are selected by name: a ':!:*_test.go' pathspec also
        # drops registrytest.go and schematest.go.
        hits=$(git ls-files -z -- '*cue.mod/module.cue' | xargs -0 -r grep -HnE 'v: *"[^"]*-0\.dev\.' || true)
        [ -z "$hits" ] || report "dev CUE pins in cue.mod/module.cue:" "$hits"
        hits=$(git ls-files -z -- 'opm/*.go' | grep -zv '_test\.go$' | xargs -0 -r grep -HnE '"[^"]*-0\.dev\.[^"]*"' || true)
        [ -z "$hits" ] || report "dev version literals in shipped Go:" "$hits"

        # 4. Tracked CUE local replacements.
        hits=$(git ls-files -- '*cue.mod/local-module.cue')
        [ -z "$hits" ] || report "tracked cue.mod/local-module.cue:" "$hits"

        if [ "$fail" -ne 0 ]; then
          echo -e "${RED}${BOLD}Release-pin gate failed.${RESET} A release never ships a dev, pseudo-version or replaced pin." >&2
          exit 1
        fi
        echo -e "==> ${GREEN}Release-pin gate passed:${RESET} no replace, OPM pseudo-version, dev pin or tracked local-module.cue."
